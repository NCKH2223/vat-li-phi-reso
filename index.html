<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var currentFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch || (origFetch ? origFetch.bind(window) : undefined);
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if not configurable
        }
      })();
    </script>
